name: Static site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  current-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required static assets
        run: |
          test -f index.html
          test -f CNAME
          test "$(cat CNAME)" = "madanpark.com"
          test -f robots.txt
          test -f sitemap.xml
          test -f favicon.svg
          test -f favicon.ico
          test -f apple-touch-icon.png
          test -f og-image.png
      - name: Check internal href targets
        run: |
          python3 scripts/check_links.py
