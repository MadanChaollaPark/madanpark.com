name: Static site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required static assets
        run: |
          test -f index.html
          test -f CNAME
          test "$(cat CNAME)" = "madanpark.com"
          test -f robots.txt
          test -f sitemap.xml
          test -f favicon.svg
          test -f favicon.ico
          test -f apple-touch-icon.png
          test -f og-image.png
      - name: Check internal href targets
        run: |
          python3 scripts/check_links.py
